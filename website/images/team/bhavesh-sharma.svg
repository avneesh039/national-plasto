<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="50%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D78E"/>
      <stop offset="50%" stop-color="#C8A55E"/>
      <stop offset="100%" stop-color="#8F6E2B"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#C8A55E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0E1322" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bgGrad3)"/>
  <rect width="400" height="500" fill="url(#glow3)"/>

  <!-- Architectural Frame -->
  <rect x="14" y="14" width="372" height="472" fill="none" stroke="url(#goldGrad3)" stroke-width="1.5" stroke-opacity="0.4" rx="16"/>
  <rect x="22" y="22" width="356" height="456" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" rx="12"/>

  <!-- Subtle Corner Accents -->
  <path d="M 22 40 L 22 22 L 40 22" fill="none" stroke="url(#goldGrad3)" stroke-width="2"/>
  <path d="M 378 40 L 378 22 L 360 22" fill="none" stroke="url(#goldGrad3)" stroke-width="2"/>
  <path d="M 22 460 L 22 478 L 40 478" fill="none" stroke="url(#goldGrad3)" stroke-width="2"/>
  <path d="M 378 460 L 378 478 L 360 478" fill="none" stroke="url(#goldGrad3)" stroke-width="2"/>

  <!-- Central Crest Halo -->
  <circle cx="200" cy="180" r="88" fill="#182035" stroke="url(#goldGrad3)" stroke-width="2.5" stroke-opacity="0.75" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.6))"/>
  <circle cx="200" cy="180" r="76" fill="none" stroke="url(#goldGrad3)" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.5"/>

  <!-- Executive Silhouette -->
  <g fill="none" stroke="url(#goldGrad3)" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <ellipse cx="200" cy="150" rx="34" ry="42" fill="#202A44" stroke="url(#goldGrad3)" stroke-width="2"/>
    <path d="M 136 248 C 140 206 170 196 200 196 C 230 196 260 206 264 248 Z" fill="#1C243B" stroke="url(#goldGrad3)" stroke-width="2"/>
    <path d="M 184 198 L 200 236 L 216 198" stroke="url(#goldGrad3)" stroke-width="1.8"/>
    <path d="M 196 236 L 200 258 L 204 236 Z" fill="url(#goldGrad3)"/>
  </g>

  <!-- Monogram Medallion -->
  <circle cx="200" cy="275" r="22" fill="#0E1322" stroke="url(#goldGrad3)" stroke-width="2"/>
  <text x="200" y="282" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" fill="url(#goldGrad3)" letter-spacing="1">BS</text>

  <!-- Typography Details -->
  <text x="200" y="340" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="19" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">MR. BHAVESH SHARMA</text>
  <text x="200" y="365" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#C8A55E" letter-spacing="2">EXECUTIVE DIRECTOR</text>
  
  <!-- Lineage Pill -->
  <g transform="translate(105, 395)">
    <rect width="190" height="28" rx="14" fill="#0284C7" fill-opacity="0.16" stroke="#0284C7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="95" y="18" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.2">PRODUCTION · SALES · E-COMMERCE</text>
  </g>

  <text x="200" y="450" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="500" fill="#8896AB" letter-spacing="1.5">NATIONAL PLASTO PRODUCTS PVT. LTD.</text>
</svg>

